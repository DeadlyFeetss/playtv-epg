            "Nova.cz",
            "POLAR.cz",
            "PRAHA.TV.cz",
            "PREMIER.SPORT.1.HD.sk",
            "PREMIER.SPORT.2.HD.sk",
            "PREMIER.SPORT.3.HD.sk",
            "PREMIUM.HD.sk",
            "Paprika.cz",
            "Park.TV.cz",
            "Premium.cz",
            "Prima.COOL.SK.cz",
            "Prima.Cool.cz",
            "Prima.KRIMI.SK.cz",
            "Prima.Krimi.cz",
            "Prima.LOVE.SK.cz",
            "Prima.LOVE.cz",
            "Prima.MAX.cz",
            "Prima.SK.cz",
            "Prima.Show.cz",
            "Prima.Star.cz",
            "Prima.cz",
            "RELAX.cz",
            "RETRO.Music.TV.sk",
            "Red.Bull.TV.cz",
            "Rik.TV.cz",
            "STORY.4.sk",
            "Senzi.sk",
            "Seznam.cz.TV.cz",
            "Skvelé.TV.cz",
            "Spektrum.Home.HD.sk",
            "Spektrum.cz",
            "Sport1.HD.sk",
            "Sport1.cz",
            "Sport2.HD.sk",
            "Stingray.CMusic.cz",
            "Stingray.Classica.cz",
            "Superyacht.cz",
            "TA3.HD.sk",
            "TLC.HD.sk",
            "TN.Live.cz",
            "TV.Bratislava.cz",
            "TV.Brno.1.cz",
            "TV.Doktor.cz",
            "TV.REBEL.sk",
            "TV.Spark.HD.sk",
            "Travel.Channel.HD.sk",
            "Travel.XP.HD.sk",
            "Turbo.TV.cz",
            "Viasat.Explore.HD.sk",
            "Viasat.History.HD.sk",
            "Viasat.Nature.HD.sk",
            "Warner.TV.cz",
            "ducktv.plus.cz",
            "iConcerts.HD.sk",
            "Óčko.Black.HD.sk",
            "Óčko.Expres.HD.sk",
            "Óčko.HD.sk",
            "Óčko.Star.HD.sk",
            "ČT.:D.cz",
            "ČT.sport.cz",
            "ČT1.cz",
            "ČT2.cz",
            "ČT24.cz",
            "Šlágr.Muzika.cz",
            "Šlágr.Originál.cz"
          ]);

          for (const parentId of Object.keys(PLUS_ONE_CLONES)) NEEDED_IDS.add(parentId);

          // Univerzálny sťahovač podporujúci presmerovania a gzip
          function downloadUrl(url, dest) {
            return new Promise((resolve, reject) => {
              const parsed = new URL(url);
              const client = parsed.protocol === 'https:' ? https : http;
              const req = client.get(url, { agent: false, headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' } }, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  const nextUrl = new URL(res.headers.location, url).toString();
                  return resolve(downloadUrl(nextUrl, dest));
                }
                if (res.statusCode !== 200) {
                  return reject(new Error(`HTTP ${res.statusCode} from ${url}`));
                }
                const file = fs.createWriteStream(dest);
                res.pipe(file);
                file.on('finish', () => { file.close(); resolve(); });
                file.on('error', (err) => { fs.unlink(dest, () => {}); reject(err); });
              });
              req.on('error', reject);
            });
          }

          async function run() {
            const t0 = Date.now();
            const skGz = 'sk_temp.xml.gz';
            const czGz = 'cz_temp.xml.gz';
            const m3u4uFile = 'm3u4u_temp.xml';
            const progTemp = 'progs_temp.txt';
            const outXml = 'epg.xml';

            console.log('1. Sťahujem čerstvé EPG dáta (epgshare01 SK + CZ a m3u4u hybrid)...');
            await downloadUrl('https://epgshare01.online/epgshare01/epg_ripper_SK1.xml.gz', skGz);
            await downloadUrl('https://epgshare01.online/epgshare01/epg_ripper_CZ1.xml.gz', czGz);
            try {
              await downloadUrl('https://m3u4u.com/epg/26p5n37dp9s96xe7nv7j', m3u4uFile);
              console.log('m3u4u hybrid zdroj úspešne stiahnutý.');
            } catch (err) {
              console.warn('Upozornenie: m3u4u hybrid sa nepodarilo stiahnuť, pokračujem bez neho:', err.message);
            }

            const channelMap = new Map();
            const progStream = fs.createWriteStream(progTemp, { encoding: 'utf8' });

            // Definície pre +1 kanály
            for (const [pId, clone] of Object.entries(PLUS_ONE_CLONES)) {
              channelMap.set(clone.targetId, `  <channel id="${clone.targetId}">\n    <display-name lang="sk">${clone.targetName}</display-name>\n  </channel>\n`);
            }

            // Definície pre hybridné kanály z m3u4u
            for (const [sId, info] of Object.entries(M3U4U_REMAP)) {
              channelMap.set(info.targetId, `  <channel id="${info.targetId}">\n    <display-name lang="sk">${info.targetName}</display-name>\n  </channel>\n`);
            }

            // Spracovanie hlavných EPG zoznamov (epgshare01)
            async function processGz(gzPath) {
              const gunzip = zlib.createGunzip();
              const rl = readline.createInterface({ input: fs.createReadStream(gzPath).pipe(gunzip), crlfDelay: Infinity });

              let inChannel = false, inProg = false, curBlock = '', curId = '', curProgChannel = '';

              for await (const line of rl) {
                if (line.includes('<channel id=')) {
                  const m = line.match(/<channel id="([^"]+)">/);
                  curId = m ? m[1] : '';
                  if (NEEDED_IDS.has(curId)) { inChannel = true; curBlock = line + '\n'; }
                  else inChannel = false;
                } else if (inChannel) {
                  curBlock += line + '\n';
                  if (line.includes('</channel>')) {
                    inChannel = false;
                    if (curId && !channelMap.has(curId)) channelMap.set(curId, curBlock);
                    curBlock = ''; curId = '';
                  }
                } else if (line.includes('<programme')) {
                  const m = line.match(/channel="([^"]+)"/);
                  curProgChannel = m ? m[1] : '';
                  if (NEEDED_IDS.has(curProgChannel)) { inProg = true; curBlock = line + '\n'; }
                  else inProg = false;
                } else if (inProg) {
                  curBlock += line + '\n';
                  if (line.includes('</programme>')) {
                    inProg = false;
                    progStream.write(curBlock);

                    // Duplikovanie relácií pre sesterské ID (napr. Sport1.cz -> Sport1.HD.sk)
                    if (PROGRAMME_ALIASES[curProgChannel]) {
                      for (const aliasId of PROGRAMME_ALIASES[curProgChannel]) {
                        const aliased = curBlock.replace(/channel="([^"]+)"/, `channel="${aliasId}"`);
                        progStream.write(aliased);
                      }
                    }

                    // Ak ide o materskú stanicu +1 kanála, vygenerujeme posunutý program o 1 hodinu dozadu (-1)
                    if (PLUS_ONE_CLONES[curProgChannel]) {
                      const clone = PLUS_ONE_CLONES[curProgChannel];
                      const shifted = curBlock.replace(/<programme([^>]+)>/, (match, attrs) => {
                        let a = attrs.replace(/channel="([^"]+)"/, `channel="${clone.targetId}"`);
                        a = a.replace(/start="([^"]+)"/, (m, s) => `start="${shiftXmltvTime(s, -1)}"`);
                        a = a.replace(/stop="([^"]+)"/, (m, s) => `stop="${shiftXmltvTime(s, -1)}"`);
                        return `<programme${a}>`;
                      });
                      progStream.write(shifted);
                    }
                    curBlock = ''; curProgChannel = '';
                  }
                }
              }
            }

            // Spracovanie hybridných relácií z m3u4u
            async function processM3u4u(filePath) {
              if (!fs.existsSync(filePath)) return;
              let inStream = fs.createReadStream(filePath);
              const headerBuf = Buffer.alloc(2);
              const fd = fs.openSync(filePath, 'r');
              fs.readSync(fd, headerBuf, 0, 2, 0);
              fs.closeSync(fd);
              if (headerBuf[0] === 0x1f && headerBuf[1] === 0x8b) {
                inStream = inStream.pipe(zlib.createGunzip());
              }
              const rl = readline.createInterface({ input: inStream, crlfDelay: Infinity });
              let inProg = false, curBlock = '', curProgChannel = '';

              for await (const line of rl) {
                if (line.includes('<programme')) {
                  const m = line.match(/channel="([^"]+)"/);
                  curProgChannel = m ? m[1] : '';
                  if (M3U4U_REMAP[curProgChannel]) {
                    inProg = true; curBlock = line + '\n';
                  } else inProg = false;
                } else if (inProg) {
                  curBlock += line + '\n';
                  if (line.includes('</programme>')) {
                    inProg = false;
                    const remap = M3U4U_REMAP[curProgChannel];
                    const mappedBlock = curBlock.replace(/channel="([^"]+)"/, `channel="${remap.targetId}"`);
                    progStream.write(mappedBlock);
                    curBlock = ''; curProgChannel = '';
                  }
                }
              }
            }

            console.log('2. Filtrujem stanice a generujem hybridné relácie...');
            await processGz(skGz);
            await processGz(czGz);
            await processM3u4u(m3u4uFile);
            await new Promise(r => progStream.end(r));

            console.log('3. Zapisujem finálne optimalizované epg.xml...');
            const finalStream = fs.createWriteStream(outXml, { encoding: 'utf8' });
            finalStream.write('<?xml version="1.0" encoding="utf-8"?>\n<tv generator-info-name="PlayTV Hybrid EPG" generator-info-url="https://playtv.vip/">\n');

            for (const block of channelMap.values()) finalStream.write(block);

            const progRead = fs.createReadStream(progTemp);
            await new Promise((resolve, reject) => {
              progRead.pipe(finalStream, { end: false });
              progRead.on('end', resolve);
              progRead.on('error', reject);
            });

            finalStream.write('</tv>\n');
            await new Promise(r => finalStream.end(r));

            try { fs.unlinkSync(skGz); } catch(e){}
            try { fs.unlinkSync(czGz); } catch(e){}
            try { fs.unlinkSync(m3u4uFile); } catch(e){}
            try { fs.unlinkSync(progTemp); } catch(e){}

            const stat = fs.statSync(outXml);
            console.log(`✅ Úspech za ${((Date.now() - t0)/1000).toFixed(1)}s! Veľkosť súboru: ${(stat.size/1024/1024).toFixed(2)} MB, Kanálov: ${channelMap.size}`);
            process.exit(0);
          }

          run().then(() => {
            process.exit(0);
          }).catch(err => {
            console.error('CHYBA:', err);
            process.exit(1);
          });
          EOF

      - name: Publikovanie do repozitára
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add epg.xml
          if git diff --staged --quiet; then
            echo "EPG sa od poslednej kontroly nezmenilo."
          else
            git commit -m "Automatická aktualizácia Hybrid EPG [skip ci]"
            git push
            echo "Nové optimalizované EPG úspešne nahrané!"
          fi
