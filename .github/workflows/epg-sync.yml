name: Automatická aktualizácia Hybridného EPG z epgshare01 a m3u4u

on:
  schedule:
    # Spúšťa sa automaticky každých 6 hodín
    - cron: '0 */6 * * *'
  # Možnosť spustiť kedykoľvek manuálne jedným klikom na GitHube (Actions -> Run workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stiahnutie, filtrovanie na PlayTV a generovanie Hybridného EPG
        shell: bash
        run: |
          node - << 'EOF'
          const http = require('http');
          const https = require('https');
          const zlib = require('zlib');
          const fs = require('fs');
          const readline = require('readline');
          const path = require('path');
          const { URL } = require('url');

          // Pomocná funkcia pre posun času o -1 hodinu (dozadu) pre stanice +1 HD
          function shiftXmltvTime(str, hours) {
            const m = str.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?$/);
            if (!m) return str;
            const d = new Date(Date.UTC(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10), parseInt(m[4],10), parseInt(m[5],10), parseInt(m[6],10)));
            d.setUTCHours(d.getUTCHours() + hours);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())} ${m[7] || '+0100'}`;
          }

          // Klonovanie programov pre +1 stanice s posunom o 1 hodinu dopredu
          const PLUS_ONE_CLONES = {
            "Markíza.HD.sk": { targetId: "Markíza.+1.HD.sk", targetName: "Markíza +1 HD" },
            "JOJ.HD.sk": { targetId: "JOJ.+1.HD.sk", targetName: "JOJ +1 HD" },
            "JOJ.Cinema.HD.sk": { targetId: "JOJ.Cinema.+1.HD.sk", targetName: "JOJ Cinema +1 HD" }
          };

          // Duplikovanie programov na alternatívne / sesterské ID (napr. Sport1.cz -> Sport1.HD.sk)
          const PROGRAMME_ALIASES = {
            "Sport1.cz": ["Sport1.HD.sk"],
            "Premium.cz": ["PREMIUM.HD.sk"]
          };

          // Hybridné dopĺňanie chýbajúcich staníc z m3u4u (kde epgshare nemá relácie)
          const M3U4U_REMAP = {
            "C+Sport2.cz (src01)": { targetId: "Canal+.Sport.2.cz", targetName: "Canal+ sport 2" },
            "C+Sport3.cz (src01)": { targetId: "Canal+.Sport.3.cz", targetName: "Canal+ sport 3" },
            "FashionBox.sk (src09)": { targetId: "FashionBox.HD.cz", targetName: "FashionBox HD" },
            "Filmbox Arthouse.sk (src09)": { targetId: "FilmBox.Arthouse.HD.sk", targetName: "FilmBox Arthouse" },
            "TN Live.cz (src09)": { targetId: "TN.Live.cz", targetName: "TN Live" },
            "TV.NR.SR.cz (src05)": { targetId: "NRSR.TV.HD.sk", targetName: "NRSR TV HD" }
